<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Zaza ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      overflow: hidden;
    }

    .box {
      background: rgba(255,255,255,0.25);
      padding: 40px;
      border-radius: 25px;
      width: 80%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 42px;
      color: white;
    }

    #message {
      min-height: 80px;
      font-size: 22px;
      color: white;
      margin: 25px 0;
      line-height: 1.5;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: #ff6f91;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .heart {
      position: absolute;
      font-size: 25px;
      animation: fall 5s linear forwards;
    }

    @keyframes fall {
      from {
        transform: translateY(-50px);
        opacity: 1;
      }

      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>For Zaza ❤️</h1>

    <div id="message">
      I have something to tell you...
    </div>

    <button onclick="newMessage()">
      Click me ❤️
    </button>

  </div>

  <script>

    const messages = [
      "You're genuinely one of my favorite people. ❤️",
      "Your smile can make my entire day better.",
      "I don't think you realize how special you are to me.",
      "Talking to you is honestly one of my favorite things.",
      "You're beautiful, but it's your personality that makes you unforgettable. ❤️",
      "If I could choose anyone to spend my time with, I'd still choose you.",
      "You somehow make ordinary days feel special.",
      "I'm really lucky to have you. ❤️",
      "Zaza, you're stuck with me now. 😌❤️",
      "And if you ever forget how much you mean to me... come back to this website. ❤️"
    ];

    function newMessage() {

      const random =
        messages[Math.floor(Math.random() * messages.length)];

      document.getElementById("message").innerText = random;

      for (let i = 0; i < 15; i++) {
        createHeart();
      }
    }

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "heart";
      heart.innerText = "❤️";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration =
        (2 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

  </script>

</body>
</html>
